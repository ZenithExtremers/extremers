<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>エクストリーマーズ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">

  <section id="home" class="screen active">
    <img class="logo" src="icons/icon-512.png" alt="エクストリーマーズのアイコン">
    <h1 class="title">エクストリーマーズ</h1>
    <p class="sub">選ばれしエクストリーマーたちよ、極限へ。</p>
    <div class="stack">
      <button class="btn primary" data-start="cpu">CPUと対戦</button>
      <button class="btn" data-start="2p">2人で対戦（1台を回す）</button>
      <button class="btn" id="openLogs">対戦ログ</button>
      <button class="btn ghost" id="openSettings">設定</button>
    </div>
    <p class="note" id="keyNote"></p>
  </section>

  <section id="settings" class="screen">
    <h2 class="h2">設定</h2>
    <label class="field">Gemini APIキー（無料）
      <input id="apiKey" type="password" autocomplete="off" placeholder="AIza...">
    </label>
    <p class="note">キーは <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" style="color:var(--yellow)">Google AI Studio</a> で無料で作れます。支払い情報を登録しなければ課金されません。</p>
    <label class="field">モデル
      <select id="model">
        <option value="gemini-3.5-flash">Gemini 3.5 Flash（おすすめ）</option>
        <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite（速い・回数に余裕）</option>
        <option value="gemini-2.5-pro">Gemini 2.5 Pro（じっくり・回数少なめ）</option>
      </select>
    </label>
    <p class="note">キーはこの端末の中にだけ保存され、Googleへの通信にだけ使われます。無料枠では1日に使える回数に上限があり、送った内容はGoogleのサービス改善に使われます。</p>
    <div class="stack">
      <button class="btn primary" id="saveSettings">保存</button>
      <button class="btn ghost" data-go="home">戻る</button>
    </div>
  </section>

  <section id="loading" class="screen">
    <div class="spinner" aria-hidden="true"></div>
    <p class="loadingText" id="loadingText">準備中…</p>
  </section>

  <section id="error" class="screen">
    <h2 class="h2">うまくいきませんでした</h2>
    <p class="note" id="errorText"></p>
    <div class="stack">
      <button class="btn primary" id="retryBtn">もう一度</button>
      <button class="btn ghost" data-go="home">タイトルへ</button>
    </div>
  </section>

  <section id="handoff" class="screen">
    <p class="kicker" id="handoffKicker"></p>
    <h2 class="h2 big" id="handoffTitle"></h2>
    <p class="note" id="handoffNote"></p>
    <button class="btn primary" id="handoffBtn">準備OK</button>
  </section>

  <section id="draft" class="screen">
    <div class="draftHead">
      <span class="kicker" id="draftKicker"></span>
      <span class="who" id="draftWho"></span>
    </div>
    <div class="timer"><div class="bar" id="timerBar"></div></div>
    <div class="cards" id="cards"></div>
    <div class="myTeam" id="myTeam"></div>
  </section>

  <section id="reveal" class="screen">
    <p class="kicker">全チーム公開</p>
    <div id="teamsBox"></div>
    <div class="taskBox">
      <p class="kicker">究極の課題</p>
      <p class="task" id="taskText"></p>
    </div>
    <button class="btn primary" id="beginBtn">挑戦スタート</button>
  </section>

  <section id="stage" class="screen">
    <p class="kicker" id="stageKicker"></p>
    <p class="scene" id="sceneText"></p>
    <p class="who" id="stageWho"></p>
    <div class="stack" id="optionsBox"></div>
  </section>

  <section id="roll" class="screen">
    <p class="kicker" id="rollKicker"></p>
    <h2 class="h2" id="rollTitle"></h2>
    <p class="note" id="rollPlan"></p>
    <div class="member rollWho" id="rollWho"></div>
    <p class="rollLine" id="rollLine"></p>
    <div class="die" id="dieFace" aria-live="polite">?</div>
    <p class="rollVerdict" id="rollVerdict"></p>
    <button class="btn primary" id="rollBtn">サイコロを振る</button>
  </section>

  <section id="result" class="screen">
    <p class="kicker" id="resultKicker"></p>
    <div id="resultBox"></div>
    <div class="score" id="scoreBox"></div>
    <button class="btn primary" id="resultNext"></button>
  </section>

  <section id="final" class="screen">
    <p class="kicker">決着</p>
    <h2 class="winner" id="winnerText"></h2>
    <p class="scene" id="epilogueText"></p>
    <div class="score" id="finalScore"></div>
    <div class="stack">
      <button class="btn primary" id="againBtn">もう一度あそぶ</button>
      <button class="btn ghost" data-go="home">タイトルへ</button>
    </div>
  </section>

  <section id="logs" class="screen">
    <h2 class="h2">対戦ログ</h2>
    <div class="stack" id="logList"></div>
    <button class="btn ghost" data-go="home">タイトルへ</button>
  </section>

  <section id="logView" class="screen">
    <div class="stack" id="logDetail"></div>
    <button class="btn ghost" id="backToLogs">ログ一覧へ</button>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>
<script src="app.js"></script>
</body>
</html>
